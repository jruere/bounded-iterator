[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bounded-iterator"
version = "1.0.2"
description = "Limits the number of values generated by an iterator until acknowledged."
readme = "README.rst"
requires-python = ">=3.9"
license = { text = "LGPLv3" }
keywords = ["concurrency", "parallelism", "iterator", "iterable", "multiprocessing", "imap"]
authors = [{ name = "Javier Ruere", email = "javier@ruere.com.ar" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["typing_extensions"]

[project.urls]
Homepage = "https://github.com/jruere/bounded-iterator"

[tool.setuptools]
py-modules = ["bounded_iterator"]

[tool.black]
line-length = 100
target-version = ['py310']
preview = false

[tool.coverage.run]
source = ["bounded_iterator"]

[tool.mypy]
python_version = '3.10'

files = "."
exclude = "build"

# Display the codes needed for # type: ignore[code] annotations.
show_error_codes = true

strict = true

# We use a lot of third-party libraries we don't have stubs for, as
# well as a handful of our own modules that we haven't told mypy how
# to find.  Ignore them.  (For some details, see:
# `git log -p -S ignore_missing_imports mypy.ini`.)
#
# This doesn't get in the way of using the stubs we *do* have.
ignore_missing_imports = true

# Warn of unreachable or redundant code.
warn_unreachable = true

[tool.ruff]
target-version = "py39"
fix = true
force-exclude = true
line-length = 100
